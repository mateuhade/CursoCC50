------------------------------------ INTERNET ---------------------------------------
The internet, to put it simply, is the network that connect all networks in the world
be it via wireless technologies or via cable.

> TCP/IP
IP Adress:
An IP address is, how the name describes, an adress. For example, when a message is
sent via mail, you need the receiver's adress to send it, an IP works the same way,
but with computers and routers instead of people.
But this creates a problem for when we need to get an IP address from somewhere, since
to communicate we need an IP, but to send that IP we need to communicate.

DNS:
To solve that problem, we have the Domain Name System. Since we can't simply remember
the IP addresses of every site we want to log into, we created a system that converts
characters like google.com to IP addresses, so that we can access information without
an IP adress.

TCP:
A Transmission Control Protocol, is a way to organize servers. For example, when a
single server executes multiple features like hosting searches, calls, chats etc. The 
server should also receive from the TCP, a small integer named PORT. That PORT, tells
the server what type of service will be executed, for example the PORT for a webpage 
(http) is 80, the PORT for a secure webpage (https) is 443, etc. 
The TCP, also handles the proccess of retransmitting data when something goes wrong 
and the request for aservice doesn't work.
Also, when, for example, a large amount of data is being transmitted, it is common
for the data to be split into pieces so that the server doesn't get overwhelmed.

HTTP:
Hyper Text Transfer Protocol, or HTTP, is a type of service that determines the 
specific features that will be executed in the web page. Metaphorically, if the TCP
and the IP adresses are what is written on the outside of an envelope, the HTTP
protocol is one of the things that can be inside that envelope.
HTTPS is just HTTP but it specifies that the data inside it is encrypted, the S stands
for Secure.

WWW:
The WWW host name is just a convention for indicating that the link is for a website, 
but it is not strictly necessary, working just as heritage.

DOMAIN NAME:
The actual domain name, refer to NOTE1->INTERNET->DNS

TLD:
The Top Level Domain is just a convention for types of websites, like org, com, edu,
mil, br, uk, etc. Not all TLDs are strictly under convention but these examples usually
are.
