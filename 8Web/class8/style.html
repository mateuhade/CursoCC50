<!DOCTYPE lang="pt-BR">
<html>
    <head>
        <!--Defines visual attributes of items in the webpage
        #ID will modify every item in the page which has that specific ID
        a will modify every item in the page that has the anchor tag
        a:hover will modify the properties of every anchor in the file that happens on hovering over it-->
        <style>
            #Pudding
            {
                color:orange
            }

            #duck
            {
                color:yellow
            }

            a
            {
                text-decoration: none;
            }

            a:hover
            {
                text-decoration: underline;
            }

            body
            {
                color: white
            }
            
            

        </style>

        <title>
            style
        </title>
    </head>

    <body>
        <body style="background-color: #1E1D36;">

        <!-- The alt attribute here works for accessibility and description of images-->
        <!-- The source attribute says teh source of the image that will be set by the img tag-->
        <img alt="Duck image" src="duck.jpg"> 

        <!-- The anchor tag <a> gets a hyperlink reference as the link that will be attached-->
        <p>
            Eat <a href="duck.jpg" id="duck">Ducks</a>
        </p>
        <!-- Anchor tags will not work without the protocol HTTP or HTTPS-->
        <p>
            Love <a href="https://pudim.com.br/" id="Pudding">Puddings</a>
        </p>

        <!-- The form tag creates a form field, by specifying an action it will execute whatever
        is inside it if able, and by using the HTTP method attibute we can specify what will be used
        on the recieved information from the form-->
        <form action="https://www.google.com/search" method="get">
            <!-- here we create a form defined as search and store it in a variable called q-->
            <input name="q" type="search">
            <!-- and here we create a button written "Search" on it that will insert the stored
            variable into the action attribute and submit it-->
            <input type="submit" value="Search">
        </form>
    </body>
</html>
