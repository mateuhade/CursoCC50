<!-- NOTE 3
------------------------------------ HTML ---------------------------------------
HTML is a markup language, not a programming language per say. In HTML we don't
use much logic, instead we tell a browser what to display and how to display it,
being more focused in the style of the page than in the code.

Tags/Elements:
tags are words between brackets <this> that can be followed by attibutes, they
define a visual that the HTML file is going to show in the browser. For example:
<head>, <body>, <div>, etc.

Attributes:
Attributes are like arguments for a tag, for example in <html lang="en">, we tell
the browser that the webpage's text will be mainly in english.
-->
<!--this defines what the file is containing, in this case a HTML file version 5-->
<!DOCTYPE html> 

<!--the html tag defines the contents of the webpage-->
<html lang="en">
    <head>
        <title>
            hello, title
        </title>
    </head>
    <!--The rectangular visual part of the webpage-->
    <body>
        hello, body
    </body>
</html>
