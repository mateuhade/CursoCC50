<!--NOTE 4-->
<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <title>
            tags
        </title>
    </head>
    <body>
        <!-- -------------------------HEADERS AND PARAGRAPHS----------------------------- -->
        <h1>One</h1> <!--This is a header-->
        <p>
            This is a paragraph
        </p>
        <h2>Two</h2>
        <p>
            This another paragraph
        </p>
        <h3>Three</h3>
        <p>
            This is the paragraph number 3
        </p>
        <h4>Four</h4>
        <p>
            This is the paragraph number 4
        </p>
        <h5>Five</h5>
        <p>
            This is the paragraph number 5
        </p>
        <h6>Six</h6>
        <p>
            This is the paragraph number 6
        </p>

        <!-- -----------------------------LISTS AND TABLES----------------------------- -->
        <ul> <!--This is an Unordered list, that is, a list of items not numbered-->
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
        <ol>
            <li>Item</li>
            <li>Item</li>
            <li>Item</li>
        </ol>

        <table> <!-- Tag for a table, similar to a spreadsheet or a SQL table-->
            <tr> <!-- Table row-->
                <td>1</td> <!-- Table data -->
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
            </tr>
            <tr>
                <td>7</td>
                <td>8</td>
                <td>9</td>
            </tr>
            <tr>
                <td>*</td>
                <td>0</td>
                <td>#</td>
            </tr>
        </table>
    </body>
</html>
