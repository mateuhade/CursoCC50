{% extends "layout.html" %}

{% block title %}
    Quotes
{% endblock %}

{% block main %}
    <div>
        <h2>{{symbol}}</h2>
        <h3>{{companyName}}</h3>
        <h1>${{price}}</h1>
    </div>

    <form action="/quoted" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="symbol" placeholder="Symbol" type="text">
        </div>
        <button class="btn btn-primary" type="submit">Get Quotes</button>
    </form>
{% endblock %}
